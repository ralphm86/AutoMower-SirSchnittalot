# Sir Schnittalot dashboard (core cards only, no HACS).
# Paste via: Dashboard > Edit > three dots > Raw configuration editor.
# Entity IDs assume the device is named "Sir Schnittalot"; if HA created different
# IDs (device name follows the mower's own name), find/replace "sir_schnittalot".
title: Mower
views:
  - title: Mower
    path: mower
    icon: mdi:robot-mower
    type: sections
    max_columns: 3
    sections:
      # ── Status and controls ───────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Sir Schnittalot
            icon: mdi:robot-mower
          # Only visible when something needs attention.
          - type: conditional
            conditions:
              - condition: state
                entity: lawn_mower.sir_schnittalot
                state: error
            card:
              type: tile
              entity: sensor.sir_schnittalot_error
              name: Mower needs attention
              icon: mdi:alert-circle
              color: red
              vertical: false
          - type: tile
            entity: lawn_mower.sir_schnittalot
            name: Mower
            vertical: false
            features_position: bottom
            features:
              - type: lawn-mower-commands
                commands:
                  - start_pause
                  - dock
          - type: gauge
            entity: sensor.sir_schnittalot_battery
            name: Battery
            min: 0
            max: 100
            needle: false
            severity:
              red: 0
              yellow: 25
              green: 50
          - type: tile
            entity: binary_sensor.sir_schnittalot_charging
            name: Charging
            vertical: false
          - type: tile
            entity: sensor.sir_schnittalot_session
            name: Session
            icon: mdi:calendar-clock
            vertical: false
          - type: tile
            entity: sensor.sir_schnittalot_next_start
            name: Next start
            vertical: false

      # ── Manual control and planner ────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Control
            icon: mdi:gamepad-variant
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.sir_schnittalot_mow_duration
                name: Mow for (hours)
              - entity: switch.sir_schnittalot_smart_planner
                name: Smart planner
              - entity: button.sir_schnittalot_resume
                name: Resume planner / schedule
              - entity: button.sir_schnittalot_park_until_further_notice
                name: Park until further notice
          - type: heading
            heading: Weather watchdog
            icon: mdi:weather-pouring
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.sir_schnittalot_weather_watchdog_enabled
                name: Park when rain is detected
              - entity: binary_sensor.sir_schnittalot_parked_by_weather_watchdog
                name: Currently parked by watchdog
              - entity: sensor.sir_schnittalot_weather_watchdog
                name: Last check

      # ── History and health ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
            icon: mdi:chart-timeline-variant
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.sir_schnittalot_battery
                name: Battery
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.sir_schnittalot_activity
                name: Activity
              - entity: sensor.sir_schnittalot_state
                name: State
          - type: heading
            heading: Health
            icon: mdi:heart-pulse
          - type: gauge
            entity: sensor.sir_schnittalot_blade_wear
            name: Blade wear
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.sir_schnittalot_running_time
                name: Total running time
              - entity: sensor.sir_schnittalot_charging_cycles
                name: Charging cycles
          - type: heading
            heading: Connection
            icon: mdi:bluetooth
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sir_schnittalot_bluetooth_link
                name: Bluetooth link
              - entity: sensor.sir_schnittalot_last_ha_command
                name: Last command from HA
