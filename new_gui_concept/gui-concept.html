<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sir Schnittalot | GUI Concept</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="gui-concept.css">
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <div class="shell">
    <aside>
      <a class="brand" href="#overview"><img src="../logo.png" alt=""><span><strong>Sir Schnittalot</strong><small>RITTER DES RASENS</small></span></a>
      <nav class="nav" aria-label="Main navigation" id="nav"></nav>
      <div class="sidebar-bottom" id="sidebar-bottom"></div>
    </aside>
    <div class="workspace">
      <header class="top">
        <div class="breadcrumb">My garden <span aria-hidden="true">&nbsp;/&nbsp;</span> <strong id="breadcrumb">Overview</strong></div>
        <a class="mobile-brand" href="#overview"><img src="../logo.png" alt="">Sir Schnittalot</a>
        <div class="chips" id="chips" aria-label="Global status"></div>
      </header>
      <main id="main" tabindex="-1">
        <div id="banners"></div>
        <section class="view" id="overview" aria-labelledby="h-overview" hidden></section>
        <section class="view" id="control" aria-labelledby="h-control" hidden></section>
        <section class="view" id="planning" aria-labelledby="h-planning" hidden></section>
        <section class="view" id="activity" aria-labelledby="h-activity" hidden></section>
        <section class="view" id="settings" aria-labelledby="h-settings" hidden></section>
        <footer class="foot"><span>Local connection &middot; no cloud account</span><span>Illustrative concept &middot; no real mower is controlled</span></footer>
      </main>
    </div>
  </div>

  <div id="snow" aria-hidden="true"></div>
  <div class="toast-wrap" role="status" aria-live="polite" id="toasts"></div>
  <div class="sr-only" role="status" aria-live="polite" id="announcer"></div>

  <details class="switcher" id="switcher">
    <summary>Concept state switcher (demo only)</summary>
    <div class="body" id="switcher-body"></div>
  </details>

  <dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>

  <script src="gui-concept.js"></script>
  <script src="gui-concept-ui.js"></script>
  <script src="gui-concept-views.js"></script>
</body>
</html>
